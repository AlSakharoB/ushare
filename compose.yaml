name: receiptsplit
services:
  db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: receiptsplit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-receiptsplit}
      POSTGRES_DB: receiptsplit
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptsplit"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., dockerfile: infra/Dockerfile.api}
    environment:
      DATABASE_URL: postgresql+psycopg://receiptsplit:${POSTGRES_PASSWORD:-receiptsplit}@db:5432/receiptsplit
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      BOT_TOKEN: ${BOT_TOKEN:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      STORAGE_PATH: /private
    volumes: ["private-assets:/private"]
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: {context: ., dockerfile: infra/Dockerfile.frontend}
    ports: ["127.0.0.1:8080:80"]
    depends_on: {api: {condition: service_healthy}}
  ocr:
    profiles: [ocr]
    build: {context: ., dockerfile: infra/Dockerfile.ocr}
    environment: {OCR_MODELS_PATH: /models}
    volumes: ["ocr-models:/models:ro", "private-assets:/private:ro"]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  postgres-data:
  private-assets:
  ocr-models:
