name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13-alpine
        env: {POSTGRES_USER: receiptsplit, POSTGRES_PASSWORD: receiptsplit, POSTGRES_DB: receiptsplit}
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U receiptsplit" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.10.9', python-version: '3.12.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.15.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: make setup migrate check
